services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_TZ: ${APP_TZ}
      PORT: ${PORT}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      REPORT_DIR: /app/Report
      NETWORK_INGEST_TOKEN: ${NETWORK_INGEST_TOKEN}
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      UNIFI_API_BASE_URL: ${UNIFI_API_BASE_URL}
      UNIFI_SITE_ID: ${UNIFI_SITE_ID}
      UNIFI_CONSOLE_ID: ${UNIFI_CONSOLE_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
    volumes:
      - ${REPORT_HOST_DIR:-./Report}:/app/Report:ro
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT}:80"
    depends_on:
      - backend
