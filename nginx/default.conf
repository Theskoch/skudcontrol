server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Behind a reverse proxy (e.g. Nginx Proxy Manager) terminating HTTPS,
        # pass through its scheme instead of overwriting with our own (always
        # "http", since NPM talks to this container over plain HTTP).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite's build output is content-hashed (index-<hash>.js) - safe to cache
    # aggressively forever, since any code change produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # The SPA shell itself must always be revalidated - it's what points
        # at the current hashed asset filenames, so a stale cached copy of
        # THIS file is what serves old JS to the browser after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
